<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz One Piece</title>
    <link rel="stylesheet" href="../quiz/quizF.css">
</head>

<body>
    <header>
        <div class="container-pai">
            <img src="logoGear5.png" height="75px" width="75px" alt="Logo Gear 5" />
            <ul class="navbar">
                <li><a href="#h1_sobre">Sobre o Anime</a></li>
                <li><a href="#h1_Faccoes">Facções</a></li>
                <li><a href="#h1_calculadora">Quiz</a></li>
                <li><a href="../login/login.html">Login</a></li>
            </ul>
        </div>
    </header>

    <div class="container">

        <div class="top-questions">
            <h1>Bem-vindo ao One Piece Quiz</h1>
            <h2>Vamos Jogar?</h2>
            <h2>Serão exibidas questões para descobrir sua justiça!</h2>
        </div>

        <div id="pergunta_container">
            <h3 id="div_mensagem">Carregando pergunta...</h3>

            <div class="respostas">
                <select id="select_resposta"></select>
            </div>
        </div>

        <br>

        <button onclick="verificar()">Confirmar Resposta</button><br><br>
        <button onclick="proxima()">Próxima Pergunta</button>

        
        <div id="resultado_final" style="margin-top: 40px; font-size: 28px; font-weight: bold;"></div>

    </div>

</body>
</html>
<script>

var Perguntas = [
    { pergunta: "Dentre as virtudes, qual você mais preza?", alternativas: ["Liberdade", "Justiça", "Altruismo"] },
    { pergunta: "Em uma jornada pelos mares como One Piece, você prefere?", alternativas: ["Viver a vida em meio as ondas", "Dedicar a vida a proteger os outros", "Dedicar a vida a mudar o mundo"] },
    { pergunta: "Qual parte da vida mais de te agrada?", alternativas: ["A presença e companhia da familia", "A aventura da vida", "Tentar melhorar para as proximas gerações"] },
    { pergunta: "Em uma situação de injustiça você tende a", alternativas: ["Se colocar no lugar da pessoa e tomar uma ação", "Se colocar no lugar da pessoa e refletir sobre o porque aquela situação acontece", "Apenas ajudar"] },
    { pergunta: "O que é mais importante para você?", alternativas: ["Minha própria liberdade e dos que escolhem segui-la", "A proteção das pessoas e manutenção da ordem", "Garantir justiça para os oprimidos, mesmo contra a ordem"] },
    { pergunta: "Você encontra um tesouro raro e valioso. O que faz com ele?", alternativas: ["Uso para realizar meus sonhos", "Entrego para as autoridades", "Uso para ajudar quem precisa"] },
    { pergunta: "Como você enxerga a hierarquia?", alternativas: ["Algo que limita quem sou", "Fundamental para manter ordem", "Uma ferramenta — pode ser usada para o bem ou para o mal"] },
    { pergunta: "Qual frase mais combina com você?", alternativas: ["A justiça é soberana!", "A paz deve ser protegida.", "Quero viver minha vida livre"] },
    { pergunta: "Você testemunha alguém sendo abusado por uma autoridade poderosa", alternativas: ["O medo do caos que isso pode gerar", "A raiva por controlarem os outros", "O senso de justiça negada"] },
    { pergunta: "O mundo ideal seria…", alternativas: ["Um onde todos sigam princípios e a paz seja mantida.", "Um onde todos tenham força e voz para mudar o que é errado.", "Um onde cada pessoa busque seus sonhos sem restrições."] },
    { pergunta: "O que você valoriza mais em sua tripulação / aliados?", alternativas: ["Disciplina e hierarquia", "União pela causa e igualdade", "Lealdade entre pessoas que escolheram estar juntas"] },
    { pergunta: "Um superior lhe dá uma ordem que você considera moralmente errada. O que faz?", alternativas: ["Cumpro — minha opinião não pode atrapalhar o bem maior.", "Questiono e, se necessário, desobedeço para impedir injustiças.", "Ignoro — quem manda em mim sou eu"] },
    { pergunta: "Há um protesto na sua cidade contra o governo. Você…", alternativas: ["Mantém distância e prioriza estabilidade e segurança.", "Participa ativamente se acreditar na causa.", "Só iria se puder transformar em festa e aventura"] },
    { pergunta: "Um negócio local está quase fechando:", alternativas: ["Apoio se estiver dentro das regras e da lei", "Organizo uma campanha para salvar o comércio", "Chamo geral para ir lá gastar junto e festejar"] },
    { pergunta: "Um professor trata um aluno injustamente:", alternativas: ["Reporto aos responsáveis para corrigir a situação", "Defendo e protesto contra o tratamento injusto", "Peito o professor sem medo"] },
    { pergunta: "Durante uma viagem, você precisa escolher sua rota:", alternativas: ["A mais segura, para proteger todos a bordo", "A que leva a ajudar quem precisa, mesmo sendo difícil", "A mais desafiadora e cheia de perigos — vale a aventura!"] },
    { pergunta: "Sua família quer escolher seu futuro profissional", alternativas: ["Tento conciliar o que quero com o que é esperado", "Provo que minha escolha pode gerar impacto positivo", "Faço o que quero e pronto — minha vida, minhas regras"] }
];


var pontosPirata = 0;
var pontosMarinha = 0;
var pontosRevolucionario = 0;
var perguntaAtual = 0;

function mostrarPergunta() {
    var atual = Perguntas[perguntaAtual];

   
     div_mensagem.innerHTML = atual.pergunta;


    select_resposta.innerHTML = `
        <option value="0">${atual.alternativas[0]}</option>
        <option value="1">${atual.alternativas[1]}</option>
        <option value="2">${atual.alternativas[2]}</option>
    `;
}


function verificar() {
var respostas = Number(select_resposta.value);

if(respostas === 0){
    pontosPirata++
}else if(respostas === 1){
    pontosMarinha++
}else pontosRevolucionario++

proxima();

}
 

function proxima() {
    perguntaAtual++;

    if (perguntaAtual < Perguntas.length) {
        mostrarPergunta();
    } else {
        finalizarQuiz();
    }
}

/* ==========================
   FINALIZAÇÃO DO QUIZ
========================== */

function finalizarQuiz() {
    document.getElementById("pergunta_container").style.display = "none";

    let resultado = "";

    if (pontosPirata > pontosMarinha && pontosPirata > pontosRevolucionario) {
        resultado = "Você é PIRATA!";
    } else if (pontosMarinha > pontosPirata && pontosMarinha > pontosRevolucionario) {
        resultado = "Você é da MARINHA!";
    } else {
        resultado = "Você é REVOLUCIONÁRIO!";
    }

    resultado_final.innerHTML = resultado;

    // Enviar para o backend
    fetch("/tentativa/registrar", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            fkUsuario: sessionStorage.ID_USUARIO,
            fkQuiz: 1,
            alternativaPirata: pontosPirata,
            alternativaMarinha: pontosMarinha,
            alternativaRevolucionarios: pontosRevolucionario
        })
    })
    .then(r => r.json())
    .then(r => console.log("Tentativa registrada:", r))
    .catch(e => console.error("Erro ao registrar:", e));
}

/* ==========================
   INICIAR QUIZ
========================== */

window.onload = mostrarPergunta;






</script>
